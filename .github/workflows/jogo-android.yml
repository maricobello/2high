# Testa o jogo PRUMO e gera o APK de Android (versão de teste, instalável direto
# no celular). O arquivo fica em Actions > execução > Artifacts > prumo-apk.
name: Jogo PRUMO · APK Android

on:
  workflow_dispatch:
  push:
    paths:
      - "jogo/**"
      - ".github/workflows/jogo-android.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jogo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jogo/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android

      - name: Compilar APK
        working-directory: jogo/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: prumo-apk
          path: jogo/android/app/build/outputs/apk/debug/app-debug.apk
